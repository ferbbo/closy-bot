name: "PR Task (SDD)"
description: "Tarea derivada de un brief.md aprobado. Mapea a un REQ-ID + AC-ID del brief."
title: "PR-XX REQ-NN: <descripcion corta>"
labels:
  - pr-task
body:
  - type: markdown
    attributes:
      value: |
        Cada issue mapea a exactamente 1 requisito (REQ-ID) del brief.
        El brief debe tener status APPROVED antes de crear issues.

  - type: input
    id: pr_id
    attributes:
      label: "PR ID"
      description: "Ej: PR-04, PR-06"
      placeholder: "PR-04"
    validations:
      required: true

  - type: input
    id: req_id
    attributes:
      label: "REQ-ID (del brief)"
      description: "Ej: REQ-01, REQ-02"
      placeholder: "REQ-01"
    validations:
      required: true

  - type: input
    id: brief_path
    attributes:
      label: "Brief (ruta)"
      description: "Ruta al brief aprobado."
      placeholder: "docs/plan/pr-briefs/PR-04-carrito-crud.md"
    validations:
      required: true

  - type: input
    id: brief_status
    attributes:
      label: "Status del brief"
      description: "Debe ser APPROVED o AMENDED."
      placeholder: "APPROVED"
    validations:
      required: true

  - type: textarea
    id: requisito
    attributes:
      label: "Requisito (del brief)"
      description: "Copia textual del REQ del brief."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria (AC-ID del brief)"
      description: "Criterios verificables asociados a este REQ."
      placeholder: |
        - [ ] AC-01: ...
    validations:
      required: true

  - type: textarea
    id: paths
    attributes:
      label: "Paths a tocar"
      description: "Archivos/carpetas relevantes para este requisito."
      placeholder: |
        - apps/api/src/domain/...
        - prisma/schema.prisma
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: "Evidencia esperada"
      description: "Como se demuestra que el AC se cumple (test name, log, screenshot)."
      placeholder: |
        - test: `describe('CartService', () => it('should add item'))`
    validations:
      required: true

  - type: checkboxes
    id: dod
    attributes:
      label: "DoD (Core V1)"
      description: "Debe cumplirse antes de cerrar el issue."
      options:
        - label: "Idempotencia implementada y testeada (si aplica)"
          required: true
        - label: "Estado persistido en Postgres (sin logica solo en memoria)"
          required: true
        - label: "Guardrails: no inventa precio/stock/politicas/ETA"
          required: true
        - label: "PII minimizada y sin logs de datos sensibles"
          required: true
        - label: "Tests relevantes agregados/actualizados"
          required: true
        - label: "pnpm lint y pnpm test pasan"
          required: true

  - type: textarea
    id: comandos
    attributes:
      label: "Comandos para validar"
      description: "Que correr para verificar."
      value: |
        - pnpm lint
        - pnpm test
        - (si aplica) pnpm db:migrate
    validations:
      required: true
